name: flop-conformance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "vendor/tclk/**"
      - "tools/export-flop-conformance-fixture.mjs"
      - ".github/workflows/flop-conformance.yml"
jobs:
  tclk-transcript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node tools/export-flop-conformance-fixture.mjs
      - id: conformance
        uses: retardio73-boop/flop-conformance-lab@ebec8f7c8e581de18d637314c84b02c9c0e67c82
        with:
          profile: tclk-transcript
          input: evidence/flop-tclk-transcript.json
          out: conformance-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: flop-tclk-transcript-conformance
          path: conformance-report.json
